<?xml version="1.0" encoding="UTF-8"?>
<!-- meetcap - a microphone on a record button. Reads at 24px; no thin strokes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4a63"/>
      <stop offset="1" stop-color="#232a3a"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- capsule -->
  <rect x="25" y="13" width="14" height="24" rx="7" fill="#f4f6fb"/>
  <!-- cradle: the arc under the capsule, plus the stand -->
  <path d="M18 31a14 14 0 0 0 28 0" fill="none" stroke="#f4f6fb"
        stroke-width="4.5" stroke-linecap="round"/>
  <path d="M32 45v6" fill="none" stroke="#f4f6fb"
        stroke-width="4.5" stroke-linecap="round"/>

  <!-- recording -->
  <circle cx="47" cy="47" r="8.5" fill="#232a3a"/>
  <circle cx="47" cy="47" r="5.5" fill="#e5484d"/>
</svg>
